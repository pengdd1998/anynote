# flutter_native_splash configuration
# Generate splash screens with: dart run flutter_native_splash:create
# Remove splash screens with: dart run flutter_native_splash:remove
#
# Prerequisites:
#   1. Add flutter_native_splash to dev_dependencies in pubspec.yaml
#   2. Run: dart run flutter_native_splash:create

flutter_native_splash:
  # Warm white for light mode, deep navy for dark mode
  color: "#FAF8F5"
  color_dark: "#1A1E2E"

  android: true
  ios: true
  web: true

  android_gravity: center
  ios_content_mode: center
  web_image_mode: center

  android_12:
    color: "#FAF8F5"
    color_dark: "#1A1E2E"
    icon_background_color: "#FAF8F5"
    icon_background_color_dark: "#1A1E2E"
