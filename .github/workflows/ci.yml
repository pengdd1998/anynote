name: CI

# AnyNote continuous integration: backend tests, frontend tests, database migrations.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: backend
          verify: false

      - name: Security scan (gosec)
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

      - name: Test with coverage
        run: |
          go test ./... \
            -race \
            -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic

      - name: Check coverage threshold (50%)
        run: |
          COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Go coverage: ${COV}%"
          awk "BEGIN { if ($COV < 50) { print \"Coverage $COV% is below 50% threshold\"; exit 1 } }"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

      - name: Vulnerability check (govulncheck)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Flutter Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Install system dependencies (libsodium for crypto tests)
        run: |
          sudo apt-get update
          wget -q https://github.com/jedisct1/libsodium/releases/download/1.0.20-RELEASE/libsodium-1.0.20.tar.gz
          tar -xzf libsodium-1.0.20.tar.gz
          cd libsodium-1.0.20
          ./configure --prefix=/usr
          make
          sudo make install
          sudo ldconfig
          echo "LD_LIBRARY_PATH=/usr/local/lib" >> $GITHUB_ENV

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Drift, etc.)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # pipefail: without it the step reports tee's exit code, and a
        # warning that CD's analyze step rejects (it fails on warnings) went
        # unnoticed here until the v2.8.10 deploy was skipped for one.
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee frontend-analyze.txt
          echo '## Flutter Analyze Output' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat frontend-analyze.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Test with coverage
        # A real gate since 2026-11-24. It used to be continue-on-error
        # because the suite had 45 tests that had failed for months; that
        # also hid five more broken on 2026-11-20 for days.
        run: flutter test --coverage

      - name: Check coverage threshold
        # lcov/genhtml may not be available on the runner; skip gracefully.
        run: |
          if command -v lcov &> /dev/null; then
            TOTAL=$(lcov --summary coverage/lcov.info 2>&1 | grep lines | awk '{print $2}' | sed 's/%//')
            echo "Flutter line coverage: ${TOTAL}%"
            if (( $(echo "$TOTAL < 60" | bc -l) )); then
              echo "Coverage $TOTAL% is below 60% threshold"
              exit 1
            fi
          else
            echo "lcov not available; skipping coverage threshold check"
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 14

      - name: Dependency audit
        continue-on-error: true
        run: flutter pub outdated

  # ── Database on the shipped SQLCipher build ──────────────────────────────
  # The local database is SQLCipher-encrypted. The job above runs the tests
  # on the runner's plain SQLite and does not fail the build on test failures
  # (`continue-on-error`), so it cannot tell when the app's database layer
  # only works on plain SQLite — the 2026-11 upgrade regression that made
  # every upgraded install unable to open its notes passed that job. This one
  # runs the database tests inside an image whose SQLCipher matches the
  # Android build (same version, same compile flags; see the Dockerfile) and
  # is a hard gate.
  database-sqlcipher:
    name: Database on SQLCipher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the SQLCipher test image
        uses: docker/build-push-action@v6
        with:
          context: frontend/tool/sqlcipher-env
          file: frontend/tool/sqlcipher-env/Dockerfile
          tags: anynote-flutter-sqlcipher:4.10.0
          load: true
          cache-from: type=gha,scope=sqlcipher-env
          cache-to: type=gha,mode=max,scope=sqlcipher-env

      - name: Test the database layer
        # ANYNOTE_REQUIRE_SQLCIPHER=1 turns "no SQLCipher found, skipping
        # those tests" (test/flutter_test_config.dart) into a hard failure,
        # so a broken image cannot pass this job by testing nothing.
        run: |
          docker run --rm \
            -e ANYNOTE_REQUIRE_SQLCIPHER=1 \
            -v "$PWD/frontend:/app" \
            -v pubcache:/root/.pub-cache \
            -w /app \
            anynote-flutter-sqlcipher:4.10.0 \
            sh -c 'flutter pub get \
              && dart run build_runner build --delete-conflicting-outputs \
              && flutter test test/core/database/ --reporter expanded'

  # ── Integration Tests ────────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16  # Postgres 16 + pgvector (semantic search)
        env:
          POSTGRES_USER: anynote
          POSTGRES_PASSWORD: test
          POSTGRES_DB: anynote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anynote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgres://anynote:test@localhost:5432/anynote_test?sslmode=disable"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests (repository)
        run: go test -tags=integration -v -count=1 ./internal/repository/

      - name: Run integration tests (handler)
        run: go test -tags=integration -v -count=1 ./internal/handler/

  # ── Database Migrations ──────────────────────────────────────────────────
  migrations:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: backend

    # PostgreSQL service container for migration testing.
    services:
      postgres:
        image: pgvector/pgvector:pg16  # Postgres 16 + pgvector (semantic search)
        env:
          POSTGRES_USER: anynote
          POSTGRES_PASSWORD: test
          POSTGRES_DB: anynote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anynote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build migrate binary
        run: go build -o /tmp/migrate ./cmd/migrate

      - name: Run migrations (first pass)
        run: |
          DATABASE_URL="postgres://anynote:test@localhost:5432/anynote_test?sslmode=disable" /tmp/migrate

      - name: Run migrations again (idempotency check)
        run: |
          DATABASE_URL="postgres://anynote:test@localhost:5432/anynote_test?sslmode=disable" /tmp/migrate
