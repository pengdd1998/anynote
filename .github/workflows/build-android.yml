name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK Platform 36
        # sdkmanager 16.x crashes resolving the retired 'tools' package on
        # some runner images (v2.8.6-2.8.8 builds failed here), so only
        # invoke it when the platform is genuinely missing — AGP would also
        # auto-install it during the gradle build (licenses are pre-accepted
        # by setup-android).
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            sdkmanager --install "platforms;android-36" || \
              echo "::warning::sdkmanager failed; relying on AGP auto-install"
          else
            echo "android-36 already installed"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Build APK (split per ABI)
        env:
          ANDROID_KEYSTORE_PATH: ''
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          cd build/app/outputs/flutter-apk
          for apk in app-*-release*.apk; do
            arch=$(echo "$apk" | sed -E 's/app-(.+)-release.*/\1/')
            mv "$apk" "anynote-${VERSION}-${arch}.apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anynote-apk
          path: frontend/build/app/outputs/flutter-apk/anynote-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/app/outputs/flutter-apk/anynote-*.apk
          generate_release_notes: true
          body: |
            ## AnyNote ${{ github.ref_name }}

            ### Installation
            1. Download `anynote-*-arm64-v8a.apk` below (most devices)
            2. Enable "Install from unknown sources" in Android settings
            3. Open the APK to install
            4. Optionally install [Obtainium](https://github.com/ImranR98/Obtainium) for auto-updates
