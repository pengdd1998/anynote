name: Mobile QA build

# Builds an installable debug APK (arm64) for on-device QA without a local
# Flutter toolchain. The APK uses the ".debug" application id suffix, so it
# installs in parallel with a release build (see android/app/build.gradle).
on:
  workflow_dispatch:

jobs:
  debug-apk:
    name: QA debug APK (arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        # Runner default Java moved to 25 (class file major 69), which this
        # project's Gradle cannot parse ("Unsupported class file major
        # version 69"). Pin the same Temurin 17 the release build uses.
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Restore release keystore
        # Without the pinned keystore every QA build gets a fresh ephemeral
        # debug signature and cannot upgrade-install over the previous QA
        # build (INSTALL_FAILED_UPDATE_INCOMPATIBLE — QA loses its data).
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/release-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — APK will be signed with an ephemeral debug key and won't upgrade-install over signed QA builds"
          fi

      - name: Generate Drift code
        working-directory: frontend
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        working-directory: frontend
        env:
          FLUTTER_DEBUG_ID_SUFFIX: .debug
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anynote-qa-debug-arm64
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
