name: CD - Deploy

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_SERVER: ${{ github.repository }}/server
  IMAGE_NAME_WORKER: ${{ github.repository }}/worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}:${{ steps.meta.outputs.version }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:${{ steps.meta.outputs.version }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          envs: GITHUB_TOKEN,ACTOR,VERSION
          script: |
            set -euo pipefail

            echo "=== Deploying AnyNote v$VERSION ==="

            cd /home/ubuntu/projects/any-note
            git fetch --tags --force
            git checkout -f v$VERSION

            # Log into GitHub Container Registry to pull pre-built images
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            # Pull pre-built images from GitHub Actions build job
            IMAGE_TAG=$VERSION docker compose -f docker-compose.deploy.yml pull

            # Ensure shared infrastructure is running
            docker compose -f infra/docker-compose.yml up -d

            # Wait for postgres
            echo "Waiting for postgres..."
            for i in $(seq 1 30); do
              if docker exec infra-postgres pg_isready -U readpal -q 2>/dev/null; then
                echo "Postgres ready."
                break
              fi
              sleep 1
            done

            # Create anynote database if it doesn't exist
            docker exec infra-postgres psql -U readpal -tc "SELECT 1 FROM pg_database WHERE datname='anynote'" | grep -q 1 || \
              docker exec infra-postgres psql -U readpal -c "CREATE DATABASE anynote"

            # Run migrations
            echo "Running migrations..."
            IMAGE_TAG=$VERSION docker compose -f docker-compose.deploy.yml run --rm --no-deps server /app/migrate up || true

            # Start services with pre-built images
            echo "Starting services..."
            IMAGE_TAG=$VERSION docker compose -f docker-compose.deploy.yml up -d

            # Health check
            echo "Health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:36661/health > /dev/null 2>&1; then
                echo "Server is healthy."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "WARNING: Health check failed after 30s"
                IMAGE_TAG=$VERSION docker compose -f docker-compose.deploy.yml logs --tail=20 server
              fi
              sleep 1
            done

            # Cleanup old images
            echo "Cleaning up..."
            docker image prune -af --filter "until=24h" 2>/dev/null || true

            echo "=== Deploy complete ==="
