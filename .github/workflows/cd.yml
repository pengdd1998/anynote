name: CD - Deploy

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_SERVER: ${{ github.repository }}/server
  IMAGE_NAME_WORKER: ${{ github.repository }}/worker

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable

      - name: Install system dependencies (libsodium for crypto tests)
        run: |
          sudo apt-get update
          # Install newer libsodium (1.0.20+) from source since apt version is outdated
          wget -q https://github.com/jedisct1/libsodium/releases/download/1.0.20-RELEASE/libsodium-1.0.20.tar.gz
          tar -xzf libsodium-1.0.20.tar.gz
          cd libsodium-1.0.20
          ./configure --prefix=/usr
          make
          sudo make install
          sudo ldconfig
          # Set LD_LIBRARY_PATH for Flutter tests to find libsodium
          echo "LD_LIBRARY_PATH=/usr/local/lib" >> $GITHUB_ENV

      - name: Generate Drift code
        working-directory: frontend
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Backend tests
        working-directory: backend
        run: go test ./... -race -count=1

      - name: Flutter analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        working-directory: frontend
        env:
          LD_LIBRARY_PATH: /usr/local/lib
        run: flutter test

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}:${{ steps.meta.outputs.version }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:${{ steps.meta.outputs.version }}

  deploy:
    needs: [test, build-and-push]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      ACTOR: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          envs: VERSION,ACTOR,GHCR_TOKEN
          script: |
            set -euo pipefail

            TAG="${VERSION#v}"
            REGISTRY="ghcr.io/pengdd1998/anynote"

            echo "=== Deploying AnyNote $VERSION ==="

            # --- Resource guards ---
            AVAIL_MEM=$(free -m | awk '/Mem:/{print $7}')
            if [ "$AVAIL_MEM" -lt 300 ]; then
              echo "Insufficient memory (${AVAIL_MEM}MB available, need 300MB). Aborting deploy."
              exit 1
            fi
            echo "Memory OK: ${AVAIL_MEM}MB available"

            DISK_AVAIL=$(df / | tail -1 | awk '{print $4}')
            if [ "$DISK_AVAIL" -lt 524288 ]; then
              echo "Low disk (${DISK_AVAIL}KB), pruning..."
              docker system prune -af 2>/dev/null || true
              docker builder prune -f --filter "until=24h" 2>/dev/null || true
              DISK_AVAIL=$(df / | tail -1 | awk '{print $4}')
              if [ "$DISK_AVAIL" -lt 524288 ]; then
                echo "Still low disk after prune (${DISK_AVAIL}KB). Aborting deploy."
                exit 1
              fi
            fi
            echo "Disk OK: ${DISK_AVAIL}KB available"

            cd /home/ubuntu/projects/any-note
            git fetch --tags --force
            git checkout -f "$VERSION"

            # Log into GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            # Pull images sequentially to avoid memory spikes
            pull_with_retry() {
              local image=$1 max=3 n=1
              while [ $n -le $max ]; do
                echo "Pulling $image (attempt $n/$max)..."
                if docker pull "$image"; then return 0; fi
                echo "Pull failed, retrying in 10s..."
                sleep 10
                n=$((n + 1))
              done
              echo "ERROR: Failed to pull $image after $max attempts"
              return 1
            }

            pull_with_retry "$REGISTRY/server:$TAG"
            pull_with_retry "$REGISTRY/worker:$TAG"

            echo "Images pulled. Starting deploy..."

            # Ensure shared infrastructure is running
            docker compose -f infra/docker-compose.yml up -d

            # Wait for postgres
            echo "Waiting for postgres..."
            for i in $(seq 1 30); do
              if docker exec infra-postgres pg_isready -U readpal -q 2>/dev/null; then
                echo "Postgres ready."
                break
              fi
              sleep 1
            done

            # Create anynote database if it doesn't exist
            docker exec infra-postgres psql -U readpal -tc "SELECT 1 FROM pg_database WHERE datname='anynote'" | grep -q 1 || \
              docker exec infra-postgres psql -U readpal -c "CREATE DATABASE anynote"

            # Run migrations
            echo "Running migrations..."
            IMAGE_TAG="$TAG" docker compose -f docker-compose.deploy.yml run --rm --no-deps server /app/migrate up || true

            # Stop existing containers (force remove to handle stale state)
            echo "Stopping existing services..."
            IMAGE_TAG="$TAG" docker compose -f docker-compose.deploy.yml down --remove-orphans 2>/dev/null || true
            docker rm -f anynote-server anynote-worker anynote-chrome 2>/dev/null || true

            # Start services
            echo "Starting services..."
            IMAGE_TAG="$TAG" docker compose -f docker-compose.deploy.yml up -d

            # Health check (60s window)
            echo "Health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:36661/health > /dev/null 2>&1; then
                echo "Server is healthy."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "WARNING: Health check failed after 60s"
                IMAGE_TAG="$TAG" docker compose -f docker-compose.deploy.yml logs --tail=20 server
              fi
              sleep 2
            done

            # Cleanup
            echo "Cleaning up..."
            docker image prune -f 2>/dev/null || true
            docker builder prune -f --filter "until=24h" 2>/dev/null || true

            echo "=== Deploy complete ==="
